<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesa de Juegos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body{background:radial-gradient(ellipse at 50% -20%,#1f5a45,#0a1914 70%) fixed;min-height:100vh}
    h1,.navbar-brand{font-family:Fraunces,Georgia,serif}
    .juego{background:#ffffff0d;border-color:#ffffff22;transition:transform .15s}.juego:hover{transform:translateY(-4px)}
    .fieltro{position:relative;background:radial-gradient(ellipse at center,#1d6a4e,#124634);border:6px solid #3b2a1c;border-radius:1.25rem;padding:1.5rem;min-height:440px;box-shadow:inset 0 0 60px #0008}
    .piramide{position:relative;margin:0 auto}
    .carta{position:relative;width:60px;height:84px;background:#fbf8ef;color:#161616;border-radius:8px;box-shadow:0 2px 6px #0008;font-weight:700;cursor:pointer;user-select:none;display:inline-block}
    .piramide .carta,.col-sp .carta,.abanico .carta{position:absolute}
    .abanico{position:relative;width:92px;height:84px}
    .col-sp{position:relative;width:64px;border:2px dashed #ffffff22;border-radius:8px}.carta.roja{color:#c8372d}
    .carta b{position:absolute;top:5px;left:7px;font-size:17px}.carta span{position:absolute;top:23px;left:7px;font-size:14px}
    .carta em{position:absolute;inset:auto 0 8px;text-align:center;font-style:normal;font-size:30px}
    .carta.tapada{filter:brightness(.55);cursor:default}.carta:not(.tapada):hover{transform:translateY(-3px)}
    .carta.sel{outline:3px solid #e8c468}
    .carta.dorso{background:repeating-linear-gradient(45deg,#1f5c8a 0 6px,#2a74aa 6px 12px);border:3px solid #fbf8ef}
    .carta.vacia{background:#ffffff14;border:2px dashed #ffffff44;box-shadow:none;color:#fff;display:inline-grid;place-items:center;font-size:24px}
    #resultado{position:absolute;inset:0;background:#000c;border-radius:1rem;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;display:flex}
    #resultado[hidden]{display:none}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-md border-bottom border-secondary-subtle sticky-top bg-body bg-opacity-75" style="backdrop-filter:blur(8px)">
  <div class="container">
    <span class="navbar-brand fs-4">♠ Mesa de Juegos</span>
    <div class="nav me-auto">
      <button class="nav-link" data-vista="jugar">Jugar</button>
      <button class="nav-link" data-vista="ranking">Ranking</button>
      <button class="nav-link" data-vista="perfil">Mi perfil</button>
    </div>
    <div id="anon"><button class="btn btn-warning" id="btn-entrar">Entrar</button></div>
    <div id="logueado" class="d-flex align-items-center gap-3" hidden>
      <div style="min-width:150px"><div class="fw-semibold" id="nombre"></div><small class="text-body-secondary" id="nivel"></small>
        <div class="progress" style="height:5px"><div class="progress-bar bg-warning" id="xpbar"></div></div></div>
      <button class="btn btn-outline-secondary btn-sm" id="btn-salir">Salir</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <section id="vista-jugar">
    <div id="lobby">
      <h1 class="display-5 mb-1">Elige tu juego</h1>
      <p class="text-body-secondary mb-4">Gana puntos y XP en cada partida, sube de nivel y entra al ranking.</p>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="catalogo"></div>
    </div>
    <div id="mesa" hidden>
      <div class="d-flex flex-wrap align-items-center gap-3 mb-2">
        <button class="btn btn-outline-light btn-sm" id="volver">← Juegos</button>
        <h2 class="h4 m-0" id="titulo"></h2><span class="badge text-bg-warning" id="dif"></span>
        <span class="ms-auto">Puntos <b id="pts">0</b></span><span>Tiempo <b id="tiempo">0:00</b></span>
        <button class="btn btn-danger btn-sm" id="rendirse">Rendirme</button>
      </div>
      <p class="text-body-secondary small" id="ayuda"></p>
      <div class="fieltro"><div id="tablero" class="overflow-auto"></div><div id="resultado" hidden></div></div>
    </div>
  </section>

  <section id="vista-ranking" hidden>
    <h1 class="h2 mb-3">Ranking</h1>
    <div class="nav nav-pills mb-3" id="tabs"></div><div id="tabla"></div>
  </section>

  <section id="vista-perfil" hidden><h1 class="h2 mb-3">Mi perfil</h1><div id="perfil"></div></section>
</main>

<div class="modal fade" id="modal-auth" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="form-auth">
    <div class="modal-header"><h2 class="modal-title h5" id="auth-titulo">Entrar</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body vstack gap-3">
      <div><label class="form-label" for="f-user">Usuario o correo</label><input class="form-control" id="f-user" name="username" required></div>
      <div id="campo-email" hidden><label class="form-label" for="f-mail">Correo</label><input class="form-control" id="f-mail" name="email" type="email"></div>
      <div><label class="form-label" for="f-pass">Contraseña</label><input class="form-control" id="f-pass" name="password" type="password" required></div>
      <div class="text-danger small" id="auth-error"></div>
    </div>
    <div class="modal-footer justify-content-between">
      <button type="button" class="btn btn-link" id="auth-cambio">¿No tienes cuenta? Regístrate</button>
      <button class="btn btn-warning" id="auth-enviar">Entrar</button>
    </div>
  </form></div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div class="toast" id="toast" role="status" data-bs-delay="3000"><div class="toast-body" id="toast-msg"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
